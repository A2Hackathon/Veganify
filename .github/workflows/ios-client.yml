name: iOS client contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  client:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Debug and Release connection configuration
        run: |
          swiftc -D DEBUG ios/APIConfiguration.swift tests/APIConfigurationTests.swift -o /tmp/config-debug
          /tmp/config-debug
          swiftc ios/APIConfiguration.swift tests/APIConfigurationTests.swift -o /tmp/config-release
          /tmp/config-release
      - name: Type-check actual iOS API client and models
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun swiftc -typecheck -D DEBUG -sdk "$SDK" -target arm64-apple-ios16.0-simulator ios/Models.swift ios/APIConfiguration.swift ios/GenerationRetryStore.swift ios/APIClient.swift
          xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios16.0-simulator ios/Models.swift ios/APIConfiguration.swift ios/GenerationRetryStore.swift ios/APIClient.swift
      - name: Test durable recipe retry lifecycle
        run: |
          swiftc ios/GenerationRetryStore.swift tests/GenerationRetryTests.swift -o /tmp/generation-retry
          /tmp/generation-retry
          swiftc -frontend -parse ios/CookView.swift ios/SproutViewModel.swift
      - name: Build complete iOS app for simulator
        run: |
          xcodebuild -project ios/Sprout.xcodeproj -scheme Sprout -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/sprout-debug CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project ios/Sprout.xcodeproj -scheme Sprout -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/sprout-release CODE_SIGNING_ALLOWED=NO build
      - name: Test actual API client HTTP retry across process restart
        timeout-minutes: 16
        run: python3 tests/ios_transport.py
