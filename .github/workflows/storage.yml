name: Storage regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefix backend
      - name: Audit dependency advisories
        run: npm audit --audit-level=moderate --prefix backend
      - name: Check application JavaScript syntax
        run: |
          for file in backend/*.js backend/routes/*.js backend/utils/*.js backend/models/*.js backend/workers/*.js; do
            node --check "$file"
          done
      - name: Run isolated storage regressions
        run: npm test --prefix backend
      - name: Exercise real OCR with local language data
        timeout-minutes: 3
        run: |
          npm pack @tesseract.js-data/eng@1.0.0 --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tar -xOf "$RUNNER_TEMP/tesseract.js-data-eng-1.0.0.tgz" package/4.0.0_best_int/eng.traineddata.gz | gzip -d > "$RUNNER_TEMP/eng.traineddata"
          OCR_ENGLISH_DATA="$RUNNER_TEMP/eng.traineddata" npm run test:ocr --prefix backend
