name: Storage regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefix backend
      - name: Audit dependency advisories
        run: npm audit --audit-level=moderate --prefix backend
      - name: Check application JavaScript syntax
        run: |
          for file in backend/*.js backend/routes/*.js backend/utils/*.js backend/models/*.js backend/workers/*.js; do
            node --check "$file"
          done
      - name: Run isolated storage regressions
        run: npm test --prefix backend
